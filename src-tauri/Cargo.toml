[package]
name = "knot-agent"
version = "0.1.0"
description = "Universal visual desktop canvas for orchestrating terminal AI agents."
authors = ["rundevelrun"]
edition = "2021"

[lib]
name = "knot_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
